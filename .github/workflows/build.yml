# Bouwt de Windows-app. Push naar main = exe als artifact; tag v* = ook een release met de installer.
name: Bouwen

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: 'Dashboard-app ${{ github.ref_name }}'
          releaseBody: 'Download het bestand dat eindigt op `_x64-setup.exe` en volg de stappen in de README. Niet ondertekend: Windows SmartScreen waarschuwt, kies "Meer informatie" > "Toch uitvoeren".'
          releaseDraft: false
          prerelease: false

      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-app-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/dashboard-app.exe
          if-no-files-found: error
