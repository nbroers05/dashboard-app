name: Android telefoon-app

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # Zonder sleutel (nog niet ingesteld, zie android/README.md): alleen controleren of alles bouwt, niets online
      - name: Testbouw zonder sleutel
        if: env.HAS_KEY != 'true'
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Sleutel klaarzetten
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/reageren.p12"

      - name: Bouwen
        if: env.HAS_KEY == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/reageren.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Online zetten als download
        if: env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          TAG="telefoon-v$VERSION"
          cp android/app/build/outputs/apk/release/app-release.apk dashboard-telefoon.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dashboard-telefoon.apk --clobber
          else
            gh release create "$TAG" dashboard-telefoon.apk --title "Telefoon-app $VERSION" --notes "Android-app: Vandaag, Planner en Reageren in de huisstijl." --latest=false
          fi
